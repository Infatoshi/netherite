# s64boot.yaml: the night's big run's start (lane/ntboot, 2026-11-01): mcsr pareto's s64 iteration 42 (fastppo Small,
# 0.47M parameters, the 64x64 RGB cast through the stem, wm 1; the best model measured, DEVLOG "The frontier": depth
# 3.39 over 512 60-minute runs from spawn with the strip) in the native trainer, its own recipe: the pareto night's
# train-fast-64 sim (train-fast.yaml's world, start and fidelity at a 64x64 cast on the device), the recipe's macros
# and the strip, 5-minute episodes from seed 42's spawn, 256 envs in 4 groups, T 128, ent 0.01, a small step, and the
# pareto recipe's reward and archive (mcsr runs/pareto/recipe).
#   the frozen model's episodes as data (lane/ntboot's recommendation for the big run: every fine-tune from it lost
#   iron pickaxe within 10 to 40M env-steps, natively as in fastppo's own pareto iterations; DEVLOG 2026-11-01):
#   out/runtime/train/s1/ntloop --run configs/s64boot.yaml --init ~/.cache/netherite-native/models/s64-it42.ntw \
#     --learn 0 --policy actor --ep-len 72000 --hours 3 --rec DIR --rec-ms iron_pickaxe
#   a fine-tune (then rank its checkpoints: make train-score-sweep RUN=configs/s64boot.yaml V=s1 WDIR=DIR):
#   out/runtime/train/s1/ntloop --run configs/s64boot.yaml --init ~/.cache/netherite-native/models/s64-it42.ntw \
#     --fresh-opt --save-every 2 --out DIR
#   make -C csrc/runtime train-score RUN=configs/s64boot.yaml W=~/.cache/netherite-native/models/s64-it42.ntw V=s1
sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 64x64         # net.h's s1 variant (NT_SIDE 64, NT_STEM 1): make -C csrc/runtime train-loop-v NT_V=s1
  engine:
    device_mesh: 1
    raycast: device
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: spawn               # seed 42's spawn
    worlds: 256                # the pareto arms' --n
    groups: 4
    episode_seconds: 300       # the pareto arms' --seconds
  fidelity:
    spawning: off
    spawn_types: monster,creature,ambient,water
    mobs: all
    random_ticks: off
    weather: off
  performance:
    workers: 30
    streams: 0
    group: 0
    batch: 0
    depth: 0
    layout: doms
    pin: 0
    place: none
    tune: off
policy:
  actions:
    macros: recipe,strip       # fromspawn's "model" set (vecenv.RECIPE, s64-it42.pt saves none) and the strip: 16383
    picks: off
  starts:                      # the pareto recipe's --save-starts ms:...:64:0.4 (mcsr runs/pareto/recipe)
    archive: ms
    archive_items: furnace+iron_ingot+iron_pickaxe+bucket+flint_and_steel+diamond_pickaxe+obsidian+nether+blaze_rod+ender_pearl+ender_eye
    archive_pool: 64
    archive_share: 0.4
  reward:                      # the pareto recipe's reward (ntloop's keys; pairs NAME/W, the grammar holds no '=')
    log_cap: 8
    values: 4/1.0,61/8         # cobblestone 1, furnace 8 over reward.values()
    caps: 4/8,15/8,265/8,263/8   # cobblestone, iron ore, iron ingot, coal: at most 8 each counted
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/5,flint_and_steel/5,diamond_pickaxe/10,obsidian/5,blaze_rod/10
    nether: 20
  ppo:
    lr: 5e-6                   # the pareto night: 5e-6 to 1e-5 held near the teacher, 3e-5 lost depth
    ent: 0.01                  # the pareto arms' --ent
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192
    horizon: 128               # the pareto arms' --T
  net:
    kind: small
  run:
    hours: 0.5
    log_every: 60
