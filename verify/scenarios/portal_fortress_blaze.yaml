# Seed-deterministic nether route in one tape: walk into a lit overworld portal,
# ride the 4s transit, arrive on a bridge inside the seed-0 nether fortress, and
# melee the blaze at its spawner room with a diamond sword.
#
# Coordinates are seed-fixed, measured (not explored). The seed-0 blaze spawner
# rooms sit at (-325, 56, -215) and (-325, 56, -102), read straight out of the
# oracle's own DIM-1 region file after a recorded run. This scenario uses the
# z=-102 room: interior x[-327..-323] z[-104..-100], nether-brick floor y=55,
# walls y=56, fence rail y=57, open cavern above, spawner block (-325, 56, -102).
# The room is a free-standing platform, so the arrival walkway is BUILT, not carved.
#
# NOTE: magma's own locator (gm_fortress_spawner_room, magma/game/structures_live.c)
# and the blaze nether_full port both report a spawner room at (-325, 72, -151)
# for this seed, where the oracle has plain netherrack. x matches, y/z do not.
# Filed as an observation from this scenario, not fixed here.
#
# Staging: vanilla 1.11.2 has no cross-dimension command, so setup_commands build
# the overworld portal and gear, then setup_qrl uses the qrl bridge "dim" op to
# hop to the Nether, build the walkway + link portal next to the spawner room,
# summon the blaze, and hop back. The setup hop is taken from world spawn
# (0.5, 4, 0.5) on purpose: the Teleporter's auto-built portal then lands near
# nether (0,0), ~330 blocks from the fortress, so it neither damages the structure
# nor wins the recorded transit's 128-block portal search, and its
# destinationCoordinateCache key differs from the recorded entry's.
#
# Arrival facing is predictable, not lucky: Teleporter.placeInExistingPortal sets
# yaw = entry_yaw - opposite(src_forwards) + dst_forwards, and
# BlockPortal.createPatternHelper picks "forwards" as the more open side with
# POSITIVE breaking ties. Both portals are Z-axis with air on both faces, so both
# forwards are EAST and the player, entering eastbound at yaw -90, arrives at
# yaw +90 looking WEST straight down the walkway into the spawner room.
# Measured on 20260729T083655Z and 20260729T084149Z: arrival tick 148, x = portal
# block x + 0.5, yaw exactly 90.
name: portal_fortress_blaze
world:
  seed: 0
  mode: survival
  type: flat
  # REQUIRED: MapGenNetherBridge only runs when map features are enabled.
  structures: true
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule doFireTick false
  - /gamerule randomTickSpeed 0
  - /time set 6000
  - /weather clear
  - /difficulty normal
  - /gamemode survival @p
  # tp first so the portal-site chunks are loaded before any fill.
  # x=-2504 z=-816 scales to nether (-313, -102), i.e. the link-portal column.
  - /tp @p -2511.5 4 -816.0 -90 0
  - /fill -2504 3 -818 -2504 7 -815 minecraft:obsidian
  - /fill -2504 4 -817 -2504 6 -816 minecraft:air
  - /fill -2504 4 -817 -2504 6 -816 minecraft:portal 2
  - /replaceitem entity @p slot.hotbar.0 minecraft:diamond_sword 1
  # park at world spawn so the setup-only auto portal is built far from the fortress
  - /tp @p 0.5 4 0.5 -90 0
setup_qrl:
  - cmd: dim
    action: { id: -1 }
    settle_ticks: 120
  # into the spawner room (interior air, nether-brick floor y=55)
  - cmd: runcmds
    action: { cmds: ["tp @p -325.5 56 -102.5 90 0"] }
    settle_ticks: 60
  - cmd: runcmds
    action:
      cmds:
        # glowstone ring in the air under the room walls, then the 5-wide
        # nether-brick walkway east to the link portal with glowstone kerbs
        - fill -328 55 -105 -322 55 -99 minecraft:glowstone 0 replace minecraft:air
        - fill -322 55 -104 -314 55 -100 minecraft:nether_brick
        - fill -322 55 -105 -314 55 -105 minecraft:glowstone
        - fill -322 55 -99 -314 55 -99 minecraft:glowstone
        # doorway through the room's east wall + fence rail
        - fill -322 56 -103 -322 57 -101 minecraft:air
        # link portal at the east end of the walkway, Z axis like the overworld one
        - fill -313 55 -104 -313 59 -101 minecraft:obsidian
        - fill -313 56 -103 -313 58 -102 minecraft:portal 2
        # keep the spawner visible but inert: doMobSpawning does NOT gate mob
        # spawners in 1.11, and the live one added an extra blaze mid-take
        # (measured 20260729T084729Z). RequiredPlayerRange 0 never activates.
        - blockdata -325 56 -102 {RequiredPlayerRange:0}
    settle_ticks: 40
  # the spawner fires on its first activated tick (generated Delay 0), so one
  # blaze is already loose by the time blockdata lands; clear it, then place the
  # scripted one just inside the doorway on the player's approach line (z=-102).
  - cmd: runcmds
    action:
      cmds:
        - kill @e[type=Blaze]
        # NoAI is what makes the melee scriptable. A live blaze backs away to
        # its 3-8 block fireball range the moment the player closes, so a fixed
        # input never lands a swing (measured: 20260729T085530Z, blaze retreated
        # to x=-331 and stayed at 20 HP; 20260729T085238Z, same). Pinned at
        # y=57 its hitbox spans 57.0..58.8, straddling the player's 57.62 eye
        # line, so a pitch-0 crosshair is on its chest from the doorway.
        # x=-326 (beside the spawner) keeps it 2.3 blocks from the player's
        # measured stop at x=-323.7 - inside the 3.0 reach but far enough to
        # read on camera; at -323.5 it filled the whole frame (20260729T085737Z).
        - summon blaze -326.0 57 -102.0 {PersistenceRequired:1b,NoAI:1b}
    settle_ticks: 2
  # stand on the walkway (not in the portal) so the return hop's overworld
  # target lands within the 128-block search of the overworld portal
  - cmd: runcmds
    action: { cmds: ["tp @p -315.5 56 -102.5 90 0"] }
    settle_ticks: 20
  - cmd: dim
    action: { id: 0 }
    settle_ticks: 40
  # staging costs ~8 HP (blaze contact while building); start the take at full
  - cmd: runcmds
    action:
      cmds:
        - effect @p minecraft:instant_health 1 4 true
        - tp @p -2511.5 4 -816.0 -90 0
    settle_ticks: 60
duration_ticks: 427
frames_every: 1
# Attacks MUST be pulsed. Minecraft fires an entity attack on the mouse-down
# EDGE only (Minecraft.clickMouse via keyBindAttack.isPressed()), so a segment
# that holds buttons:[1] for seconds lands exactly one swing - which is why the
# existing blaze_melee/blaze_bow tapes never take the blaze below 20 HP.
# 0.2s down / 0.45s up is a 0.65s cycle, just over the 0.625s diamond-sword
# cooldown, so every click is a full-damage hit; 20 HP falls in 3.
#
# The player must also STOP at the doorway (x=-322.4, measured) rather than walk
# through: take 20260729T085238Z held w through the swings, overshot to x=-326.7
# with the blazes behind him, and landed nothing. No w after the approach.
input:
  segments:
    - seconds: 0.6
    - seconds: 1.9
      keys: [w]
    - seconds: 6.1
    - seconds: 2.6
      keys: [w]
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 0.2
      buttons: [1]
    - seconds: 0.45
    - seconds: 2.5
known_divergences: []
