# workstation-scalable.yaml — gpu-workstation 64-core Zen 5 + RTX PRO 6000 Blackwell (sm_120), ~112k env-steps/s, <20 GB RSS.
# Top-to-bottom: policy -> sim (both visible on screen 1) -> actions (top-level at bottom, alphabetical).
# All performance counts and ratios are explicit (zero auto-detection).
# Run: CUDA_VISIBLE_DEVICES=0 out/runtime/train/s1.ls/ntloop --run configs/workstation-scalable.yaml \
#        --init cache/models/s64-it42.ntw --critic 128 --out out/train/workstation-scalable

policy:
  net:
    kind: small
  ppo:
    lr: 1e-5
    ent: 0.01
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192                   # 2 segments an update (a segment: 128 horizon x 32 envs = 4,096), one minibatch of 8,192
    horizon: 128
    ref_kl: 1.0
    value_warmup: 50
    value_warmup_lr: 3e-4
  reward:
    relative: on
    nether: 20
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/5,flint_and_steel/5,diamond_pickaxe/10,obsidian/5,blaze_rod/10
  starts:
    library: cache/workstation-scalable/lib64
    curriculum: adaptive
    floor: 0.02
    spawn_min: 0.25
    seed_set: cache/statebank-2026-11-19/starts
    seeds: 100005598,1019266621,1044203914,106545754,1086470609,1113382357,1134009793,1155280576,1182857084,1207000883,1233075502,1251471117,127402861,1296218181,1319163461,1342594950
  run:
    hours: 4.5
    log_every: 60
    save_every: 20
    out: out/train/workstation-scalable

sim:
  world:
    seed: 100005598
    difficulty: easy
    render_distance: 4
  client:
    observation: 64x64
    camera: raycast
    cast_precision: 32     # the observation only, never a row (Java replay 1,200/1,200 equal); 32 is the bit-exact reference
    ticks_per_step: 1
  pipeline:
    worlds: 256                # total parallel envs
    groups: 8                  # 8 groups x 32 envs/group = 256 worlds
    episode_seconds: 600       # 12,000 ticks/episode (20 ticks/s)
    kind: snapshot             # start mode: saved world snapshot (rebranded from legacy "gold")
    start: cache/statebank-2026-11-19/starts/s100005598
  engine:
    tick: host
    raycast: device
    device_mesh: 1
    device_generation: off
    device_light: off
    render: none
  performance:
    workers: 64                # explicit: 1 worker per physical core (64 / 64 cores = 1.0x; 4 envs/worker)
    streams: 2                 # the mesh renderer's streams (render: none here); ntloop makes its own, one a group + the learner's
    group: 32                  # explicit: 32 envs/group (= worlds / groups = 256 / 8)
    batch: 256                 # explicit: 256 total batched envs (= worlds)
    depth: 8                   # explicit: 8 in-flight pipeline groups (= groups)
    layout: doms               # L3 CCD domain affinity (8 x 32 MB L3 CCDs, 32 envs/CCD)
    pin: 2                     # what layout doms with no view runs anyway: a queue per L3, each env's steps on its L3's workers
    place: domain              # each worker on any CPU of its L3 (the L3s in turn, so fewer workers than cores still use all 8)
    tune: off
    region_spill: off          # parked chunks stay in memory (the spill file wrote 135-348 GB/hr to the NVMe)

