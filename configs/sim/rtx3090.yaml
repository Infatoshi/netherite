# The training simulator sized for one RTX 3090 (sm_86) and a 16-core, 32-thread CPU with two L3s: 128 worlds in 16
# groups of 8 (a group waits for its slowest env: 8 wait less than 32; 256 worlds ran 1.5x slower, each env-step
# costing more as the worlds outgrow the L3s), 32 workers, a queue per L3 (DEVLOG 2026-11-22 lane/hill-straggler).
# The 64x64 device ray cast at FP32, one tick a step, the device mesher, vanilla fidelity. The world, the start and the
# episode length are a scenario's (configs/envs).
description: RTX 3090 + 16-core CPU, 128 worlds in 16 groups of 8, 32 workers, 64x64 device ray cast, FP32
world:
  render_distance: 4
client:
  observation: 64x64
  camera: raycast
  cast_precision: 32
  ticks_per_step: 1
pipeline:
  worlds: 128
  groups: 16
engine:
  tick: host
  raycast: device
  device_mesh: 1
  device_generation: off
  device_light: off
  render: none
performance:
  workers: 32
  streams: 2
  group: 8
  batch: 128
  depth: 16
  layout: doms
  pin: 2
  place: domain
  tune: off
  region_spill: off
