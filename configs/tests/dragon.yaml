# dragon.yaml (lane/dragon, 2026-11-01): the End fight's case. Seed 42's golden End arrival (configs/checkpoints.tsv's
# end, gold-g30-s42: reached in game through the stronghold's portal, on the obsidian platform) at vanilla fidelity
# (the Java client replays its episodes), one decision a tick, no camera worth a GPU (the macro reads endview.h, not
# the frame): out/runtime/dragon_case --config configs/tests/dragon.yaml [--policy 0|1 --seed K] (make -C csrc/runtime
# dragon-case). The kit is what the start holds (the golden run's: see DEVLOG 2026-11-01 lane/dragon).
sim:
  world:
    seed: 42
    difficulty: normal
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: semantic
    semantic: 16x16
    semantic_range: 16
  engine:
    device_mesh: 0
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: end                 # gold-g30-s42: seed 42's End arrival
    worlds: 32
    groups: 2
    episode_seconds: 1200
policy:
  actions:
    macros: base,food,dragon
