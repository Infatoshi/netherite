# workstation-ladder.yaml — the fidelity ladder on gpu-workstation (lane/fast-ladder): workstation-scalable.yaml's world, cast, reward and
# macros, trained at fast fidelity (spawning, random ticks and weather off: about 2x the env-steps a minute) for the
# first 28 minutes, then the 8 groups cross to vanilla one after another over 4 minutes (each at its next reset), so
# the last ~15 minutes and every eval are vanilla and every vanilla episode replays on the Java 1.7.10 client.
# Top-to-bottom: policy -> sim -> actions (top-level at bottom, alphabetical). All performance counts explicit.
# Differences from workstation-scalable (each forced by ntloop's ladder, neth_schedule.c):
#   - one start (sim.pipeline.start, a state-bank spawn), no starts.library or starts.seeds: ntloop refuses either
#     with a ladder ("not done yet"); the sim stays vanilla with fidelity.rung exact (a rung goes on at a reset).
#   - from scratch (ntinit s1.ls): no ref_kl anchor or value warm-up, a from-scratch step (lr 3e-4).
#   - performance.workers 32 (the lane's CPU budget on the shared host).
# Measured (lane/fast-ladder, GPU 3, 32 workers, shared host): 151.1M env-steps in 45 min against 99.8M for the same
# file without its ladder section (1.51x); the ladder's model replayed END EQUAL on Java, 72,000 rows, 0 mismatches.
# Run (the ladder arm; the vanilla arm is this file without the policy.ladder section):
#   CUDA_VISIBLE_DEVICES=3 out/runtime/train/s1.ls/ntinit out/train/init.ntw 1
#   CUDA_VISIBLE_DEVICES=3 out/runtime/train/s1.ls/ntloop --run configs/workstation-ladder.yaml --policy actor \
#     --init out/train/init.ntw --fresh-opt --critic 128 --out out/train/workstation-ladder
# Eval at vanilla (256 held-out state-bank spawns, one 60-minute episode each, start by start):
#   (VAN.yaml: this file without policy.ladder, so the eval's every episode is vanilla)
#   out/runtime/train/s1.ls/ntloop --score --run VAN.yaml --init MODEL.ntw --minutes 60 --ns 256 \
#     --seeds SEEDS --seed-set cache/statebank-2026-11-19/starts --curriculum uniform --start-cycle on --seed 1000

policy:
  net:
    kind: small
  ppo:
    lr: 3e-4
    ent: 0.01
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192                   # 4 minibatches per update (8 groups x 32 envs x 128 horizon = 32,768 batch)
    horizon: 128
  reward:
    relative: on
    nether: 20
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/5,flint_and_steel/5,diamond_pickaxe/10,obsidian/5,blaze_rod/10
  ladder:
    rungs: fast,vanilla        # low to high: fast (spawning, random ticks, weather off), then vanilla
    schedule: minutes          # the boundary in wall-clock minutes of the run
    at: 28                     # vanilla opens at minute 28
    fade: 4                    # the 8 groups cross one after another over minutes 28 to 32
    unit: group                # a group stays rung-homogeneous (its step waits only for its own envs)
  run:
    hours: 0.75
    log_every: 60
    save_every: 15
    out: out/train/workstation-ladder

sim:
  world:
    seed: 100005598
    difficulty: easy
    render_distance: 4
  client:
    observation: 64x64
    camera: raycast
    cast_precision: 32
    ticks_per_step: 1
  pipeline:
    worlds: 256                # total parallel envs
    groups: 8                  # 8 groups x 32 envs/group = 256 worlds
    episode_seconds: 600       # 12,000 ticks/episode (20 ticks/s)
    kind: snapshot             # start mode: saved world snapshot
    start: cache/statebank-2026-11-19/starts/s100005598
  engine:
    tick: host
    raycast: device
    device_mesh: 1
    device_generation: off
    device_light: off
    render: none
  performance:
    workers: 32                # explicit: the lane's 32-worker budget (8 envs/worker)
    streams: 2                 # explicit: 2 CUDA streams (actor/cast + async PPO learner)
    group: 32                  # explicit: 32 envs/group (= worlds / groups = 256 / 8)
    batch: 256                 # explicit: 256 total batched envs (= worlds)
    depth: 8                   # explicit: 8 in-flight pipeline groups (= groups)
    layout: doms               # L3 CCD domain affinity (8 x 32 MB L3 CCDs, 32 envs/CCD)
    pin: 0                     # explicit: unpinned
    place: none
    tune: off

