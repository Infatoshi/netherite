# VecBlaze run settings. The same keys apply to CPU, CUDA, and Metal.
backend = cpu
natural_spawn = 0
natural_spawn_passive = 0
device = 0
n_envs = 1
ktime = 0
stage_time = 0
legacy_recenter = 0
warp_tick = 1
op_trace = 0
no_ore_xy = 0
# CUDA per-thread stack limit in KiB. 128 is the shipped default; lower
# values free VRAM but risk k_tick_raw stack overflow (IMA) on liquid CA,
# hostile ticks, and explosions.
stack_kib = 128
no_emit_all = 0
# Maximum Metal observation cells per environment; not a world-size setting.
metal_max_cells = 2097152
metallib =
