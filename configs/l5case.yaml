# l5case.yaml (lane/ladder16): NWRL_VEC_SEEKKEY's CPU case. configs/l4case.yaml (the host's ray cast, brutetab's random
# policy, gui cursor, no GPU) from the `iron` checkpoint (gold-g4-s42: stone tools held, iron still needed), where the
# seek's start holds; from spawn a random policy never reaches it (0 steps with it holding in 32 20-minute runs at
# seeds 1 and 2: 6 of 32 make a wooden pickaxe, none a stone one). Rows: the seek by its cadence (L4g plus surface and
# mine, 1040195583), by key 13 (L5a plus surface and mine, 2113933311), none (L5a plus surface and mine without the key,
# 1040191487):
#   CUDA_VISIBLE_DEVICES= out/runtime/train/brutetab --run configs/l5case.yaml --macros 2113933311 --seed K
sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 64x64
  engine:
    device_mesh: 0
    raycast: host
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: iron                # configs/checkpoints.tsv: gold-g4-s42, stone tools, a furnace, iron still needed
    worlds: 32
    groups: 2
    episode_seconds: 600
  fidelity:
    spawning: off
    spawn_types: monster,creature,ambient,water
    mobs: all
    random_ticks: off
    weather: off
  performance:
    workers: 16
    streams: 0
    group: 0
    batch: 0
    depth: 0
    layout: any
    pin: 0
    place: none
    tune: off
policy:
  actions:
    macros: base
    picks: off
    policy_tool: on
    gui: cursor
