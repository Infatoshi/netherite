# The speedrun world on a loot seed (lane/rlbind, 2026-09-30): configs/speedrun.yaml with seed 110, whose
# spawn has a village blacksmith's chest 30 blocks away (seedworld's spawn area and the village structure walk
# agree on it: mcsr-speedrun mcsr.nwrl.seed_chests). Seed 1's nearest loot is a dungeon 150 blocks from spawn and
# its nearest temple 609 blocks away, out of a 3-minute episode's reach: the GRPO loot objective plays here.
# Its start sr-loot-s110 (oracle/tests/speedrun-loot-s110.jsonl): make -C oracle script CONF=../configs/speedrun-loot.yaml.

world:
  seed: 110
  difficulty: normal       # hostiles spawn: blazes and endermen exist
  render_distance: 4       # 64-block overworld fog (lane/headline)
  daylight_cycle: on
  keep_inventory: off
  villages: on
  horses: off
  wolves: off
  ocelots: off
  built_golems: off
  wither: off
  minecarts: off
  boats: off
  redstone: off
  enchanting: off
  anvil: off
  brewing: off
  beacon: off
  maps: off
  fishing: off
  fireworks: off
  book_editing: off
  sign_editing: off

client:
  graphics: fast
  particles: minimal
  observation: 256x144     # the policy's frame (mcsr-speedrun SPEC.md: 256x144 at 20 fps)
  ticks_per_step: 1        # the policy's 20 Hz; 4 is the headline's frame skip
  hud: on                  # the training footage has it (rlsplit-hudframe fixed)
  gamma: 1.0               # the 1.16 training renders' brightness (lane/versionprior: netherite at 0.0 is darker)

engine:
  device_mesh: 1
  device_generation: off
  device_light: off

# seed 1's fresh world under this file (oracle/tests/speedrun-s1.jsonl)
pipeline:
  kind: speedloot
  start: out/java/snapshots/sr-loot-s110
