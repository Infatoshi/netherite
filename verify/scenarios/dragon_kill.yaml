name: dragon_kill
world:
  seed: 0
  mode: survival
  type: default
  structures: true
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule randomTickSpeed 0
  # No dragon-death XP orbs: 500 xp would blow past the recorder's 32-entity
  # cap and desync which entities magma gets to draw.
  - /gamerule doMobLoot false
  - /gamerule commandBlockOutput false
  - /time set 6000
  - /weather clear
  - /difficulty normal
  - /gamemode survival @p
  - /replaceitem entity @p slot.hotbar.0 minecraft:diamond_sword 1
  - /replaceitem entity @p slot.hotbar.1 minecraft:bow 1
  - /replaceitem entity @p slot.inventory.0 minecraft:arrow 64
# Cross into the End via the raw bridge transfer (vanilla 1.11.2 has no
# dimension command); the fresh End init spawns the dragon fight.
#
# KILL ROUTE. A scripted-input scenario cannot aim a bow at an AI-driven
# dragon, so the kill is time-triggered, not aim-triggered: two buried
# repeating command blocks (y=55, inside the island, never on screen) watch
# the CAMERA PITCH and fire when the scripted look deltas tilt it up.
#   entitydata @e[type=ender_dragon] {Health:0.0f}
# is the kill - not /kill, which setDead()s the dragon with no animation.
# Health 0 makes vanilla run the real EntityDragon.onDeathUpdate: 200 ticks
# of +0.1/tick rise, +20 deg/tick yaw spin, dissolve and beams. That is the
# gated death state, on camera, at a tick we choose.
# Pitch is the arm because the setup tp pins it to exactly -15 and nothing in
# the world can move it - only a scripted look delta. (A stat.jump arm was
# tried and self-armed during setup: the stat is cumulative and a
# dragon-breath knockback hop counts as a jump. A pressure plate was tried
# too and the same knockback walked the player off it.) EntitySelector floors
# pitch and clamps it into 0..359, so -15 -> 345, -27 -> 333, -35 -> 325.
# The camera tilts TWICE and the two blocks are gated on different pitch
# windows, which sequences them:
#   PULL (pitch in [-33,-25], dragon more than 24 blocks from the anchor)
#        /tp's the dragon to the framed anchor 0.5,86,-72 and keeps it there;
#   KILL (pitch <= -33, dragon within 25 blocks of the anchor) sets Health 0.
# The 1.5s between the two tilts is what makes this work: teleporting and
# killing in the SAME tick leaves the client rendering a ghost at the old
# spot (takes 3 and 4 - a dying EntityDragon stops applying server position
# updates and just runs its local rise), so the dragon must arrive, sync and
# fly for a moment before it dies. The second tilt also closes the PULL
# window for good, so the corpse - which drifts up to 25 + 20 blocks of rise
# from the anchor - is never yanked back mid-animation.
#
# The camera itself does not move: the first take had a dragon-breath cloud
# park on the player and knock them 9 blocks sideways, so the player wears a
# knockbackResistance chestplate (invisible in first person) and Resistance V.
setup_qrl:
  - cmd: dim
    action: { id: 1 }
    settle_ticks: 100
  # Flat end stone (top y=63) runs x -2..2, z -24..-8 on seed 0; the exit
  # fountain is at 0,0, i.e. BEHIND this camera, so the podium/egg that
  # generates at deathTicks 200 never enters frame (magma replays a tick-0
  # world snapshot and would not have those blocks).
  - cmd: runcmds
    action: { cmds: ["tp @p 0.5 64 -20.5 180 -15"] }
    settle_ticks: 60
  - cmd: runcmds
    action:
      cmds:
        - effect @p minecraft:resistance 1000000 4 true
        - 'replaceitem entity @p slot.armor.chest minecraft:leather_chestplate 1 0 {AttributeModifiers:[{AttributeName:"generic.knockbackResistance",Name:"kb",Amount:1.0,Operation:0,UUIDMost:41,UUIDLeast:17,Slot:"chest"}]}'
    settle_ticks: 10
  - cmd: runcmds
    action:
      cmds:
        - 'setblock 0 55 -14 minecraft:repeating_command_block 0 replace {Command:"execute @p[rxm=-90,rx=-33] ~ ~ ~ execute @e[type=ender_dragon,x=0,y=86,z=-72,r=25] ~ ~ ~ entitydata @e[type=ender_dragon] {Health:0.0f}",TrackOutput:0b,auto:1b}'
        - 'setblock 0 55 -13 minecraft:repeating_command_block 0 replace {Command:"execute @p[rxm=-33,rx=-25] ~ ~ ~ execute @e[type=ender_dragon,x=0,y=86,z=-72,rm=24] ~ ~ ~ tp @e[type=ender_dragon] 0.5 86.0 -72.0 180 0",TrackOutput:0b,auto:1b}'
    settle_ticks: 10
  # Re-pin the exact camera pose, then park the dragon north and high so the
  # opening seconds have it flying inside the frame before its AI takes over.
  - cmd: runcmds
    action: { cmds: ["tp @p 0.5 64 -20.5 180 -15"] }
    settle_ticks: 5
  - cmd: runcmds
    action: { cmds: ["tp @e[type=ender_dragon] 0.5 86 -72 180 0"] }
    settle_ticks: 10
# frames_every 2, not 1: with a frame captured every tick the headless client
# falls to ~10.5 TPS while the integrated server keeps ticking at 20, so the
# CLIENT deathTicks counter (what the renderer dissolves on, and what the
# recorder writes) only reaches ~85 before the server hits 200 and removes
# the dragon - the beam-out never renders. At every second tick the client
# holds 20 TPS and the full 200-tick animation is captured.
duration_ticks: 570
frames_every: 2
input:
  segments:
    # 0-8.5s: free flight, camera parked at pitch -15 (trigger disarmed).
    # The opening pitch flick is not cosmetic. The headless client builds no
    # chunk meshes while it is merely stepped over the bridge - not even for
    # forced `frame` re-renders - so takes 6/7 opened on an EMPTY oracle pane
    # for ~7s while magma drew the full island. A large pitch change is what
    # made it compile (observed mid-take), so the take starts with +12 deg
    # and immediately -12 deg back to exactly -15: net zero, both ends
    # outside the trigger windows. Measured cost either way: the island,
    # pillars and crystals only finish compiling ~7s of wall time after frame
    # capture starts (tick 71 of a 10.5 TPS take, tick 142 of a 20 TPS one),
    # so the whole kill sequence is pushed past 11s and the clip drops the
    # warm-up.
    - seconds: 0.1
      look: [0.0, 80.0]
    - seconds: 0.9
      look: [0.0, -80.0]
    - seconds: 1.5
    - seconds: 0.1
      look: [1.0, 0.0]
    - seconds: 1.9
      look: [-1.0, 0.0]
    - seconds: 0.1
      look: [1.0, 0.0]
    - seconds: 1.9
      look: [-1.0, 0.0]
    - seconds: 0.1
      look: [1.0, 0.0]
    - seconds: 1.9
      look: [-1.0, 0.0]
    # 8.5s: tilt up 12 deg onto the dragon. look is a one-shot mouse delta per segment and
    # degrees = 0.15 * delta at sensitivity 0.5, so -80 is exactly -12 deg:
    # pitch -15 -> -27, inside the PULL window, and the dragon is teleported
    # into frame (alive) if it had wandered off - and held there, since the
    # PULL block re-fires whenever it strays past 24 blocks. That is what
    # buys the ~4s of on-camera flight before the kill.
    - seconds: 4.0
      look: [0.0, -80.0]
    # 12.5s: tilt up 8 more deg to pitch -35: PULL closes, KILL opens, the dragon dies on camera.
    - seconds: 1.0
      look: [0.0, -53.3333]
    # 13.5-23.5s: creep up 8 deg to follow the 0.1 blocks/tick death rise.
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    - seconds: 0.5
      look: [0.0, -2.67]
    # 23.5-28.5s: hold on the beam-out and the removal at deathTicks 200,
    # still twitching the yaw so the oracle keeps rendering.
    - seconds: 0.5
      look: [1.0, 0.0]
    - seconds: 0.5
      look: [-1.0, 0.0]
    - seconds: 0.5
      look: [1.0, 0.0]
    - seconds: 0.5
      look: [-1.0, 0.0]
    - seconds: 0.5
      look: [1.0, 0.0]
    - seconds: 0.5
      look: [-1.0, 0.0]
    - seconds: 0.5
      look: [1.0, 0.0]
    - seconds: 0.5
      look: [-1.0, 0.0]
    - seconds: 0.5
      look: [1.0, 0.0]
    - seconds: 0.5
      look: [-1.0, 0.0]
known_divergences: []
