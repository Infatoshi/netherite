# Executable wiring example, not a tuned learning recipe.
# Run from repo root: out/blaze/rl/ppo --conf blaze/rl/recipes/curriculum.conf
# CPU by default; --set backend=metal or cuda selects a supported backend.
backend = cpu
n_envs = 2
rollout_steps = 4
max_chunks = 2
checkpoint = out/blaze/rl/recipe_example.bin
phase_files = blaze/rl/recipes/local.conf,blaze/rl/recipes/explore.conf
eval_conf = blaze/rl/recipes/eval.conf
eval_every_chunks = 2
checkpoint_metric = eval_success
