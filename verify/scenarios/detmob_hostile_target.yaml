# detmob hostile targeting: load from 38.5,70,170.5, summon on the
# walkable hilltop pad (ambient xyz), then tp the player in last.
# NearestAttackableTarget + zombie melee path + creeper swell.
# Short window: player parked until first melee knockback.
# Night, difficulty easy. PersistenceRequired. det_entity_rng=1.
# doMobSpawning=false. Not a blessed gate tape.
name: detmob_hostile_target
world:
  seed: 0
  mode: survival
  type: default
  structures: false
determinism:
  det_entity_rng: true
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule mobGriefing false
  - /gamerule doMobLoot false
  - /gamerule randomTickSpeed 0
  - /time set 18000
  - /weather clear
  - /difficulty easy
  - /gamemode survival @p
  - /tp @p 38.5 70 170.5 180 10
  - /summon pig ~ ~ ~
  - /summon cow ~ ~ ~
  - /summon sheep ~ ~ ~
  - /summon chicken ~ ~ ~
  - /summon zombie ~ ~ ~
  - /summon skeleton ~ ~ ~
  - /summon creeper ~ ~ ~
  - /kill @e[type=pig,r=96]
  - /kill @e[type=cow,r=96]
  - /kill @e[type=sheep,r=96]
  - /kill @e[type=chicken,r=96]
  - /kill @e[type=zombie,r=96]
  - /kill @e[type=skeleton,r=96]
  - /kill @e[type=creeper,r=96]
  - /summon zombie 53.5 74 126.5 {IsBaby:0b,PersistenceRequired:1b}
  - /summon creeper 52.5 74 128.5 {PersistenceRequired:1b}
  - /summon skeleton 51.5 74 126.5 {PersistenceRequired:1b}
  - /entitydata @e[type=zombie,r=96] {IsBaby:0b}
  - /tp @p 53.5 74 127.5 180 20
setup_settle_ticks: 2
duration_ticks: 80
frames_every: 0
input:
  segments:
    - seconds: 4.0
known_divergences: []
