# V1 wooden-pickaxe fine-tuning. Run from the repository root.
# Supply init_from explicitly for a legacy compatible checkpoint.
backend = cuda
device = 0
n_envs = 64
rollout_steps = 32
action_repeat = 4
success_item = 270
train_seeds = 10,14,16,20,46
snaps_dir = blaze/rl/out/snaps
stage_snaps = 1
world_size = 0
lr = 0.0001
lr_floor = 0.00003
entropy_coef = 0.005
ep_dec = 1500
max_chunks = 16
max_wall = 600
checkpoint = out/blaze/rl/pickaxe_v1.bin
run_dir = out/blaze/rl/pickaxe_runs
phase_files = blaze/rl/recipes/pickaxe/logs.conf,blaze/rl/recipes/pickaxe/scratch.conf
curriculum.stage_weight.0 = 1
curriculum.stage_weight.1 = 3
# Later chain starts already contain the target; exclude them.
curriculum.stage_weight.2 = 0
curriculum.stage_weight.3 = 0
curriculum.stage_weight.4 = 0
reward.w_wpick_first = 12
reward.w_cobble_per = 0
reward.w_coal_first = 0
reward.w_torch_first = 0
reward.dig_descend_coef = 0
reward.dig_stone_atk = 0
reward.dig_hold_pick = 0
reward.coal_dist_coef = 0
reward.coal_crosshair = 0
reward.coal_hold_pick = 0
reward.coal_chew = 0
reward.hunt_desc = 0
eval_conf = blaze/rl/recipes/pickaxe/eval.conf
eval_every_chunks = 8
checkpoint_metric = eval_success
