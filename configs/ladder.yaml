# ladder.yaml: the fidelity ladder (SPEC.md "The fidelity ladder", lane/ladder) as one run file for the native trainer:
# brute.yaml's recipe at the trainer's 16x16 cast, from spawn (no milestone archive: a saved start carries the rung
# its episode ran, so ntloop refuses the two together), the sim at vanilla fidelity (no fidelity section: the start's
# image is vanilla and each rung is put on at a reset), and the policy part's ladder: train-fast's rung for the first
# 9 minutes, then the groups cross to vanilla one after another over 3 minutes, each at its next episode's reset.
# ntloop only: mcsr-speedrun's runconf.py does not know the ladder section (it refuses keys it does not know).

policy:
  net:
    kind: small
  ppo:
    lr: 3e-4
    ent: 0.003
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192
    horizon: 64
  starts:
    seeds: 42
    archive: none
  ladder:
    rungs: fast,vanilla        # low to high: vanilla, fast (spawning, random ticks, weather off), stripped (fast and
    schedule: minutes          # env_steps, minutes, milestone (milestone: NAME, window: N episodes) or fixed (shares)
    at: 9                      # where each rung past the first opens, one a boundary
    fade: 3                    # the units cross one after another over this span past the boundary (0: at once)
    unit: group                # group (a group's step waits for its slowest env) or env
  run:
    hours: 0.25
    log_every: 60

sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 16x16
  pipeline:
    kind: snapshot                 # saved world snapshot (rebranded from legacy gold)
    start: spawn
    worlds: 512
    groups: 4
    episode_seconds: 180
  engine:
    device_mesh: 0
    device_generation: off
    device_light: off
    render: none
    tick: host
  performance:
    workers: 30
    streams: 2                 # explicit: 2 CUDA streams
    group: 128                  # explicit: 128 envs/group (512 / 4)
    batch: 512                 # explicit: 512 total batched envs
    depth: 4                   # explicit: 4 in-flight pipeline groups
    layout: doms
    pin: 0
    place: none
    tune: off

actions:
  macros:
    macros: base,iron,table-anywhere
    picks: off
