# Punch a log by hand from a seed's own spawn: raw keys, empty inventory, 20 seconds (a log 8 to 16 blocks away is
# about 4 s of walking and 3 s of punching, so 20 s leaves twice the straight path). The starts are spawns with a log
# (block 17) within 16 blocks in view, harvested from the seed set by rawstarts --near-block, each start's snapshot
# replayed by test_snapshots; nether harvest --env wood-punch --seeds 1..16 --out out/bank/wood-punch.
description: punch a log (block 17) by hand from spawn, raw keys, 20 s; spawn starts with a log within 16 blocks
name: wood-punch
sim:
  world:
    seed: 1
  pipeline:
    kind: gold
    start: out/java/try/seedset-d989661987/s1
episode:
  seconds: 20
actions:
  keys: forward+back+left+right+jump+mine
macros: none
reward:
  item: 17
  win: 1
  death: -0.5
  look: 0.3
  crack: 0.05
  dist: 0.1
  shaping: potential
starts:
  library: out/bank/wood-punch/train
  curriculum: off
  pin: on
harvest:
  mode: spawn
  seed_set: out/java/try/seedset-d989661987
  near_block: 17
  near_radius: 16
  biome: any
  split_train: 0.8
eval:
  primary_metric: win
  min_z: 3
  episodes: 128
  seed: 1000
  minutes: 1
  library: out/bank/wood-punch/eval
