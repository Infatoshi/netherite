# Track 3 Stage 2: 100% Raw-Input Zero-Macro Dragon Slayer PPO (GPU 3, 16 workers, 128 envs, s1.ls.m4.b.f.sb)
# macros: none -> 0 macros, 100.0% unmasked driver==0 raw keyboard+mouse+camera PPO!
# Strictly trained on Seeds 1 & 42 (Seed 2 strictly held out!).
policy:
  net:
    kind: small
  ppo:
    lr: 8e-5
    ent: 0.01
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192
    horizon: 128
    ref_kl: 0.08
    ref_kl_min: 0.03
    ref_kl_schedule: linear
    value_warmup: 50
    value_warmup_lr: 3e-4
    stage_scale: on
  reward:
    relative: on
    end: 0
    dragon: 50
    dragon_hp: 0.5
    step_pen: 2e-4
    stall_pen: 0
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
  starts:
    library: out/train_libs/dragon_raw_train_lib
    stages: crystals_gone9+dragon_75+dragon_50+dragon_25
    curriculum: adaptive
    floor: 0.15
    spawn_min: 0.0
  run:
    hours: 3.5
    log_every: 60
    save_every: 20
    out: out/train/t3-dragon-ppo

sim:
  world:
    seed: 100005598
    difficulty: easy
    render_distance: 4
  client:
    observation: 64x64
    camera: raycast
    cast_precision: fast32
    ticks_per_step: 1
  pipeline:
    worlds: 128
    groups: 4
    episode_seconds: 600
    kind: snapshot
    start: cache/statebank-2026-11-19/starts/s100005598
  engine:
    tick: host
    raycast: device
    device_mesh: 1
    device_generation: off
    device_light: off
    render: none
  performance:
    workers: 16
    streams: 2
    group: 32
    batch: 128
    depth: 4
    layout: doms
    pin: 2
    place: domain
    tune: off
    region_spill: off

actions:
  macros:
    macros: none
    picks: off
  options:
    press_label: key
