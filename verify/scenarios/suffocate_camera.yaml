# Rank 11 mechanic: if any of 8 small eye samples lies inside an opaque block, Java attempts 1.0 HP
# IN_WALL damage every tick; ordinary hurt resistance gates effective damage. First-person rendering
# separately selects an opaque camera block and draws the inside-block overlay.
# Expected wrong-magma divergence class: physics if sample/contact, damage cadence, or escape differs;
# structural pixels if the near-black zoomed block overlay is absent or selects the wrong block face.
name: suffocate_camera
world:
  seed: 0
  mode: survival
  type: flat
  structures: false
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule randomTickSpeed 0
  - /time set 6000
  - /weather clear
  - /difficulty normal
  - /gamemode survival @p
  - /tp @p 0.5 4 0.5 -90 0
  - /setblock 0 5 0 minecraft:stone
duration_ticks: 400
frames_every: 10
input:
  segments:
    - seconds: 5.0
    - seconds: 3.0
      keys: [w]
known_divergences: []
