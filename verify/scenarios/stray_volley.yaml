name: stray_volley
world:
  seed: 0
  mode: survival
  type: flat
  structures: false
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule randomTickSpeed 0
  - /gamerule naturalRegeneration false
  - /time set 18000
  - /weather clear
  - /difficulty normal
  - /gamemode survival @p
  - /tp @p 0.5 4 0.5 0 2
  - /fill -7 3 -3 7 3 22 minecraft:stone
  - /fill -7 4 -3 -7 5 22 minecraft:stone
  - /fill 7 4 -3 7 5 22 minecraft:stone
  - /effect @p minecraft:resistance 999 4 true
  - '/summon minecraft:stray -2.5 4 15.5 {PersistenceRequired:1b}'
  - '/summon minecraft:skeleton 2.5 4 15.5 {PersistenceRequired:1b}'
duration_ticks: 400
frames_every: 10
input:
  segments:
    - seconds: 3.0
    - seconds: 5.0
      keys: [a, Shift_L]
    - seconds: 5.0
      keys: [d, Shift_L]
    - seconds: 7.0
known_divergences: []
