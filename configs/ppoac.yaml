# ppoac.yaml (lane/ppo-ac, 2026-11-19): 64x64 asymmetric actor-critic PPO over the frozen macro set. The forward
# baseline's world (lane/fwd's MANIFEST: easy, render distance 4, vanilla fidelity, every chain macro with carry and
# pick, its 107 macro options) on the device ray cast; the starts are library-kills (186 Java-harvested starts, seeds
# 1, 2, 42, every stage to the dragon) plus 88 fresh spawns (out/starts/train, fwd.sh draw tag ppoac-train), drawn by
# curric.h's adaptive curriculum. The actor sees the 64x64 cast and the legal scalars (s1.ls); the privileged critic
# is ntloop --critic H. Rewards pay only past a start's own kit (reward.relative).

policy:
  net:
    kind: small
  ppo:
    lr: 1e-5
    ent: 0.01
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192
    horizon: 128
    ref_kl: 1.0
    value_warmup: 50
    value_warmup_lr: 3e-4
  reward:
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/5,flint_and_steel/5,diamond_pickaxe/10,obsidian/5,blaze_rod/10
    nether: 20
    relative: on
  starts:
    library: cache/library-kills
    curriculum: adaptive
    floor: 0.02
    spawn_min: 0.25
    seeds: 531759396,210465447,62380047,297627613,1751706842,1366364151,851979129,988020773,1878313004,133641240,852144862,399474060,1240812027,218976146,920993475,1354714978,336657974,18067454,1615489129,283456745,984547201,1515448328,1449281585,850341665,1708490699,1355786342,1162383218,701227167,1873259604,236779718,2074396303,1135991466,1197194161,1775159214,1568157413,1596772485,1576795036,540001771,1117119105,1430830988,2101656690,1277764850,1467484545,1601103081,837892818,1078943612,1532566762,1209067221,1292131027,558700148,725669330,434478637,1040785857,779336793,184969735,818336922,1055915104,2137601960,250433673,1367434057,251050010,770672097,1656259151,1503638158,422660018,555140703,849897746,415098979,217442314,1465928744,910761831,1892901335,398790484,251304364,229743028,1321199233,700790849,427831092,544516010,1110813595,1699181581,1863663205,326238904,912727584,490664533,283700416,1179793191,2016673226
