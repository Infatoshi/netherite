# stronghold-vanilla.yaml (lane/stronghold2): NWRL_VEC_STRONGHOLD's case at vanilla fidelity (spawning of all four
# types, random ticks, weather: train-fast.yaml's world otherwise), so a recorded episode replays on the Java client
# (ntrec tape refuses another fidelity). The 12-eye kit start is a dev start (out/sh/start-kit in lane/stronghold2's
# tree; ~/dev/nw/.tmp/chain-inputs/stronghold/start-kit): the stand-in policy between the macro's steps,
#   out/runtime/train/ntloop --run configs/stronghold-vanilla.yaml --start DIR --dev --learn 0 --policy standin \
#     --ns 64 --ep-len 36000 --rec OUT --rec-keep all
sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 16x16
  engine:
    device_mesh: 1
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: spawn
    worlds: 64
    groups: 2
    episode_seconds: 1800      # 36,000 steps: the case's 30 minutes
  fidelity:
    spawning: on
    spawn_types: monster,creature,ambient,water
    mobs: all
    random_ticks: on
    weather: on
policy:
  actions:
    macros: recipe,strip,food,stronghold   # 1081343: the case's (sh_check's default)
    picks: off
