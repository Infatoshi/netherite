# pearlcase.yaml: NWRL_VEC_PEARL's case on the host alone (lane/pearl2, 2026-11-01): configs/s64pearl.yaml's world,
# start and fidelity with the 64x64 ray cast on the host and no mesh or render, so the case (a random policy, no
# model) needs no GPU and runs outside the GPU queue. Rows are the same as s64pearl's: engine choices never change one.
#   out/runtime/pearl_check --config configs/pearlcase.yaml --start out/java/snapshots/pearl-night-s42 --dev --n 32 --seed 1
sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 64x64
  engine:
    device_mesh: 0
    raycast: host
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: pearl-night-s42
    worlds: 32
    groups: 2
    episode_seconds: 440
  fidelity:
    spawning: on
    spawn_types: monster
    mobs: all
    random_ticks: off
    weather: off
  performance:
    workers: 16
    streams: 0
    group: 0
    batch: 0
    depth: 0
    layout: doms
    pin: 0
    place: none
    tune: off
