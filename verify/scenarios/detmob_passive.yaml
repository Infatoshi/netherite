# detmob experiment: parked player, populate-spawned passives, Entity.rand
# reseeded. doMobSpawning=false so the ambient spawn cycle stops drawing.
# Default-off switch; not a blessed gate tape.
name: detmob_passive
world:
  seed: 0
  mode: survival
  type: default
  structures: false
determinism:
  det_entity_rng: true
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule mobGriefing false
  - /gamerule randomTickSpeed 0
  - /time set 6000
  - /weather clear
  - /difficulty peaceful
  - /gamemode survival @p
setup_settle_ticks: 40
duration_ticks: 1200
frames_every: 0
input:
  segments:
    - seconds: 60.0
known_divergences: []
