# workstation-scalable-tps2.yaml — workstation-scalable.yaml at two game ticks a decision (lane/ticks-per-step, DEVLOG 2026-11-21).
# The same file but client.ticks_per_step 2 and the per-decision ppo.gamma and ppo.lam squared (the same discount and
# GAE trace in game time). Measured on gpu-workstation GPU 1 at 32 workers, abrun 4 rounds: game-ticks/s 1.10x over tps 1 with
# the host near idle, 1.54x with two other trainers on it (DRAM fills a game tick -21% and -38%); s64-it42 and ckpt-060 on
# 256 held-out worlds, 60 minutes: depth flat (paired +0.10, SE 0.19), deaths a run 0.34 -> 0.43. tps 4 is not offered:
# it halves those policies' depth (the iron pipeline stalls).
# Run: CUDA_VISIBLE_DEVICES=0 out/runtime/train/s1.ls/ntloop --run configs/workstation-scalable-tps2.yaml \
#        --init cache/models/s64-it42.ntw --critic 128 --out out/train/workstation-scalable-tps2

policy:
  net:
    kind: small
  ppo:
    lr: 1e-5
    ent: 0.01
    clip: 0.2
    gamma: 0.996004             # 0.998 ** 2: the per-tick discount of workstation-scalable.yaml at 2 ticks a decision
    lam: 0.9025                 # 0.95 ** 2: GAE's trace the same length in game time
    epochs: 3
    mb: 8192                   # 2 minibatches per update (8 groups x 32 envs x 128 horizon = 32,768 batch)
    horizon: 128
    ref_kl: 1.0
    value_warmup: 50
    value_warmup_lr: 3e-4
  reward:
    relative: on
    nether: 20
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/5,flint_and_steel/5,diamond_pickaxe/10,obsidian/5,blaze_rod/10
  starts:
    library: cache/workstation-scalable/lib64
    curriculum: adaptive
    floor: 0.02
    spawn_min: 0.25
    seed_set: cache/statebank-2026-11-19/starts
    seeds: 100005598,1019266621,1044203914,106545754,1086470609,1113382357,1134009793,1155280576,1182857084,1207000883,1233075502,1251471117,127402861,1296218181,1319163461,1342594950
  run:
    hours: 4.5
    log_every: 60
    save_every: 20
    out: out/train/workstation-scalable-tps2

sim:
  world:
    seed: 100005598
    difficulty: easy
    render_distance: 4
  client:
    observation: 64x64
    camera: raycast
    cast_precision: 32
    ticks_per_step: 2          # lane/ticks-per-step: two game ticks a decision, the env warm in L3 for both
  pipeline:
    worlds: 256                # total parallel envs
    groups: 8                  # 8 groups x 32 envs/group = 256 worlds
    episode_seconds: 600       # 12,000 ticks/episode (20 ticks/s)
    kind: snapshot             # start mode: saved world snapshot (rebranded from legacy "gold")
    start: cache/statebank-2026-11-19/starts/s100005598
  engine:
    tick: host
    raycast: device
    device_mesh: 1
    device_generation: off
    device_light: off
    render: none
  performance:
    workers: 64                # explicit: 1 worker per physical core (64 / 64 cores = 1.0x; 4 envs/worker)
    streams: 2                 # explicit: 2 CUDA streams (actor/cast + async PPO learner)
    group: 32                  # explicit: 32 envs/group (= worlds / groups = 256 / 8)
    batch: 256                 # explicit: 256 total batched envs (= worlds)
    depth: 8                   # explicit: 8 in-flight pipeline groups (= groups)
    layout: doms               # L3 CCD domain affinity (8 x 32 MB L3 CCDs, 32 envs/CCD)
    pin: 0                     # explicit: unpinned (0=off, 1=core, 2=sibling; unpinned is 2.4x faster shared)
    place: none
    tune: off

