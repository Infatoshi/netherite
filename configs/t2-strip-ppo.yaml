# Track 2 Stage 2: Stripped Overworld PPO (GPU 1, 24 workers, 192 envs, s1.ls.dk.m4.b.f.sb)
# Strips strip, strip2, mine, surface, fight -> neural net drives ~70-85% of steps directly!
policy:
  net:
    kind: small
  ppo:
    lr: 6e-5
    ent: 0.01
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 16384
    horizon: 128
    ref_kl: 0.10
    ref_kl_min: 0.04
    ref_kl_schedule: linear
    value_warmup: 50
    value_warmup_lr: 3e-4
    stage_scale: on
  reward:
    relative: on
    nether: 30
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/8,flint_and_steel/8,diamond_pickaxe/15,obsidian/12,blaze_rod/10
    step_pen: 2e-4
    stall_pen: 2e-3
    stall_ticks: 400
    stall_radius: 2.0
  starts:
    library: out/train_libs/overworld_train_lib
    curriculum: adaptive
    floor: 0.04
    spawn_min: 0.50
    share: steps
    episode_seconds: spawn/900,iron_pickaxe/600,bucket/600,flint_and_steel/600,diamond_pickaxe/900,obsidian/900,nether/600
    seed_set: cache/statebank-2026-11-19/starts
