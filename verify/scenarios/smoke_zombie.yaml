name: smoke_zombie
world:
  seed: 0
  mode: survival
  type: flat
  structures: false
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule randomTickSpeed 0
  - /time set 18000
  - /weather clear
  - /difficulty normal
  - /gamemode survival @p
  - /tp @p 0.5 4 0.5 0 0
  - /replaceitem entity @p slot.hotbar.0 minecraft:diamond_sword 1
  - /summon zombie 0.5 4 6.5 {PersistenceRequired:1b}
duration_ticks: 800
frames_every: 20
input:
  segments:
    - seconds: 2.0
    - seconds: 4.0
      keys: [a]
      buttons: [1]
    - seconds: 4.0
      keys: [d]
      buttons: [1]
    - seconds: 10.0
      buttons: [1]
known_divergences: []
