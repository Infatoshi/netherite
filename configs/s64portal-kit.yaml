# s64portal-kit.yaml (lane/obsidian): s64portal.yaml from the kit instead of the spawn: gold-g5-s42's tick 3600 (the
# human's run on seed 42 at y 44: a diamond pickaxe, a water bucket, flint and steel and 56 cobblestone held, a lava
# pool at y 36 and the caves' lava under it), the start NWRL_VEC_OBSIDIAN's gate and its eval play from. The start is
# a recording (out/java/snapshots/obs-g5-3600, from the checkpoint out/java/checkpoints/42/G5-3600):
#   make -C csrc/runtime obsidian-start     (both where missing: the oracle replays gold-g5-s42 to tick 3600, saves,
#                                            and records the start from the save)
#   make -C csrc/runtime rl-obsidian-gate   (the macro's acts replayed by the oracle row for row)
#   make -C csrc/runtime train-score RUN=configs/s64portal-kit.yaml W=~/.cache/netherite-native/models/s64-it42.ntw \
#     V=s1 RUNS=256 MIN=60 SEED=1000 [SCORE_ARGS="--macros 32767"]
sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 64x64         # net.h's s1 variant (NT_SIDE 64, NT_STEM 1): make -C csrc/runtime train-loop-v NT_V=s1
  engine:
    device_mesh: 1
    raycast: device
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: out/java/snapshots/obs-g5-3600   # gold-g5-s42 at tick 3600 (above)
    worlds: 256                # the pareto arms' --n
    groups: 4
    episode_seconds: 300       # the pareto arms' --seconds
  fidelity:
    spawning: on
    spawn_types: monster,creature,ambient,water
    mobs: all
    random_ticks: on
    weather: on
  performance:
    workers: 30
    streams: 0
    group: 0
    batch: 0
    depth: 0
    layout: doms
    pin: 0
    place: none
    tune: off
policy:
  actions:
    macros: recipe,strip,food,obsidian   # 16383 + food 16384 + obsidian 131072 = 163839
    picks: off
  starts:                      # the pareto recipe's --save-starts ms:...:64:0.4 (mcsr runs/pareto/recipe)
    archive: none              # the demo's episodes all from spawn
    archive_items: furnace+iron_ingot+iron_pickaxe+bucket+flint_and_steel+diamond_pickaxe+obsidian+nether+blaze_rod+ender_pearl+ender_eye
    archive_pool: 64
    archive_share: 0.4
  reward:                      # the pareto recipe's reward (ntloop's keys; pairs NAME/W, the grammar holds no '=')
    log_cap: 8
    values: 4/1.0,61/8         # cobblestone 1, furnace 8 over reward.values()
    caps: 4/8,15/8,265/8,263/8   # cobblestone, iron ore, iron ingot, coal: at most 8 each counted
    ms_weights: stone_pickaxe/10,furnace/5,iron_ingot/10,iron_pickaxe/10,bucket/5,flint_and_steel/5,diamond_pickaxe/10,obsidian/5,blaze_rod/10
    nether: 20
  ppo:
    lr: 5e-6                   # the pareto night: 5e-6 to 1e-5 held near the teacher, 3e-5 lost depth
    ent: 0.01                  # the pareto arms' --ent
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192
    horizon: 128               # the pareto arms' --T
  net:
    kind: small
  run:
    hours: 0.5
    log_every: 60
