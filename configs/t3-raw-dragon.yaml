# Track 3: 100% Raw-Input Zero-Macro Dragon Slayer (GPU 3, 16 workers, 128 envs, s1.ls.m4.b.f.sb)
# Stage 1 DAgger from frozen dragon macro teacher -> student at --level none (0 macros, 100.0% raw inputs!)
# Trains strictly on Seeds 1 & 42 (Seed 2 strictly held out!).
policy:
  net:
    kind: small
  ppo:
    lr: 3e-4
    ent: 0.01
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 2
    mb: 4096
    horizon: 128
    vf: 0.5
  reward:
    relative: on
    end: 0
    dragon: 50
    dragon_hp: 0.5
    step_pen: 2e-4
    stall_pen: 0
    log_cap: 8
    values: 4/1.0,61/8
    caps: 4/8,15/8,265/8,263/8
  starts:
    library: out/train_libs/dragon_raw_train_lib
    stages: crystals_gone9+dragon_75+dragon_50+dragon_25
    curriculum: adaptive
    floor: 0.15
    spawn_min: 0.0
  run:
    hours: 0.75
    log_every: 60
    save_every: 15
    out: out/train/t3-dragon-dagger

sim:
  world:
    seed: 100005598
    difficulty: easy
    render_distance: 4
  client:
    observation: 64x64
    camera: raycast
    cast_precision: fast32
    ticks_per_step: 1
  pipeline:
    worlds: 128
    groups: 4
    episode_seconds: 600
    kind: snapshot
    start: cache/statebank-2026-11-19/starts/s100005598
  engine:
    tick: host
    raycast: device
    device_mesh: 1
    device_generation: off
    device_light: off
    render: none
  performance:
    workers: 16
    streams: 2
    group: 32
    batch: 128
    depth: 4
    layout: doms
    pin: 2
    place: domain
    tune: off
    region_spill: off

actions:
  macros:
    macros: base,food,dragon
    picks: off
  options:
    dragon_bridge: on
    dragon_clutch: water
    dragon_crit: off
    dragon_crystals: snowball
    dragon_ender_avert: all
    dragon_follow: server
    dragon_food: fetch
    dragon_hole_floor: on
    dragon_hunt_cap: on
    dragon_wait: centre
    food_eat: any
    press_label: key
    sword_stock: one
