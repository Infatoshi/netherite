    seed: 531759396
    difficulty: easy
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    observation: 64x64
  pipeline:
    kind: snapshot                 # saved world snapshot (rebranded from legacy gold)
    start: out/starts/train/s531759396
    worlds: 256
    groups: 8
    episode_seconds: 600
  engine:
    device_mesh: 1
    raycast: device
    device_generation: off
    device_light: off
    render: none
    tick: host
  performance:
    workers: 30
    streams: 2                 # explicit: 2 CUDA streams
    group: 32                  # explicit: 32 envs/group (256 / 8)
    batch: 256                 # explicit: 256 total batched envs
    depth: 8                   # explicit: 8 in-flight pipeline groups
    layout: doms
    pin: 0
    place: none
    tune: off

