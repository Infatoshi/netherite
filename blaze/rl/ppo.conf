# Native C11 ppo smoke config. Every accepted key is listed.
# Load: ppo --conf blaze/rl/ppo.conf
# Override: --set key=value
# backend selects env + nn (cpu|cuda|metal per host binary). No fallback.
# metallib=auto uses the owned default out/blaze/env/blaze_metal_obs.metallib.

backend = cpu
device = 0
n_envs = 2
fixture = verify/fixtures/port/s10_t0_r64_no_liquid.bsnp
# Finite training world: horizontal side in blocks; snapshot height is retained.
# 64 gives 64x128x64 on the shipped fixtures. 0 preserves the full input region.
# Positive values are multiples of 16 in 32..256; expansion is rejected.
# This crops world/observation/reward coverage. It does not enable chunk streaming.
world_size = 64
rollout_steps = 4
action_repeat = 4
lr = 0.0003
ppo_clip = 0.2
value_coef = 0.5
entropy_coef = 0.01
grad_limit = 0.5
gamma = 0.995
lam = 0.95
epochs = 1
mb = 0
max_chunks = 1
max_ticks = 0
max_wall = 0
success_item = 0
t0_share = 0.30
cap_refresh = 25
train_seeds = fixture
snaps_dir = blaze/rl/out/snaps
stage_snaps = 0
lr_floor = 0.0001
lr_decay_ticks = 1500000000
ep_dec = 1500
ckpt_ticks = 2000000
seed = 0
checkpoint = out/blaze/rl/ppo_ckpt.bin
init_from =
# Observation capacity ceiling; prepared smaller worlds allocate only their
# measured cell count. This does not select the world's dimensions.
metal_max_cells = 2097152
metallib = auto
ktime = 0
stage_time = 0
legacy_recenter = 0
warp_tick = 1
op_trace = 0
no_ore_xy = 0
stack_kib = 128
nn_prec = fast
tail_mb = overlap

# Ordered phases overlay these globals independently. Empty means one phase.
# Paths are comma-separated and relative to the invocation working directory.
# A phase ends at an update boundary; episode state restarts, Adam is retained.
phase_files =
run_dir = out/blaze/rl/runs
# Fixed evaluation recipe. Enable an interval to evaluate during training.
eval_conf =
eval_executable = out/blaze/rl/eval
eval_every_chunks = 0
checkpoint_metric = train_success
# Prepared-input resource floors; unmet requirements fail rather than train an
# impossible start silently. These apply to starting snapshots, not banks.
world_min_logs = 0
world_min_coal = 0
# Deterministic angle jitter per source snapshot and seed, in degrees.
spawn_yaw_jitter = 0
spawn_pitch_jitter = 0

# Supported fixed-shape observations: no RGB or recurrent state.
# Semantic bits: log, leaves, coal, stone/dirt variants, table, occupied.
obs_history = 2
obs_semantic_mask = 127
obs_depth = 1
obs_edges = 1
obs_base_scalars = 1
obs_inventory = 1
obs_pose = 1
obs_clock = 1
# Coarse nearest-sample expansion; tensor dimensions remain 64x36.
obs_pixel_stride = 1
# Heads: yaw,pitch,forward,jump,attack,use,craft,interact,hotbar.
action_yaw_degrees = 15
action_pitch_degrees = 10
action_heads = 511

# Curriculum success window and rehearsal/seed sampling.
curriculum.mastery_threshold = 0.6
curriculum.min_episodes = 15
curriculum.history_window = 60
curriculum.stage_weight.0 = 1
curriculum.stage_weight.1 = 1
curriculum.stage_weight.2 = 1
curriculum.stage_weight.3 = 1
curriculum.stage_weight.4 = 1
# curriculum.seed_weight.N indexes the configured train_seeds order.
# All weights default to 1; zero excludes that seed. Example override:
# curriculum.seed_weight.0 = 2

# Dense assistance scale leaves milestone bonuses and penalties intact.
reward.shaping_scale = 1
reward.time_cost = 0.01
reward.death_penalty = 5
reward.w_log_per = 1
reward.log_clamp = 5
reward.w_plank_first = 2
reward.w_stick_first = 2
reward.w_table_first = 3
reward.w_container_open = 4
reward.w_wpick_first = 6
reward.w_cobble_per = 1
reward.cobble_clamp = 4
reward.w_spick_first = 0
reward.w_coal_first = 6
reward.w_torch_first = 12
reward.chop_dist_coef = 0.5
reward.chop_dist_clamp = 1
reward.chop_crosshair = 0.03
reward.dig_descend_coef = 0.25
reward.dig_stone_atk = 0.02
reward.dig_hold_pick = 0.005
reward.digprog_coef = 0.0015
reward.coal_dist_coef = 0.5
reward.coal_dist_clamp = 1
reward.coal_crosshair = 0.03
reward.coal_crosshair_maxd = 3.5
reward.coal_hold_pick = 0.005
reward.coal_chew = 0
reward.hunt_desc = 0
reward.w_furnace_first = 0
reward.w_furnace_open = 0
reward.w_ironore_per = 0
reward.ironore_clamp = 3
reward.w_ingot_first = 0
reward.w_ipick_first = 0
