# detmob hostile targeting: player parked on the known seed-0 grass at
# 38.5,70,170.5 (ambient pad). Mobs summoned ~7 blocks north so
# NearestAttackableTarget fires and they path in, but they should not
# close to melee/knockback during this short window (player stays parked).
# Night, difficulty easy (bow cooldown 40). PersistenceRequired.
# det_entity_rng=1, doMobSpawning=false. Not a blessed gate tape.
name: detmob_hostile_target
world:
  seed: 0
  mode: survival
  type: default
  structures: false
determinism:
  det_entity_rng: true
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule mobGriefing false
  - /gamerule doMobLoot false
  - /gamerule randomTickSpeed 0
  - /time set 18000
  - /weather clear
  - /difficulty easy
  - /gamemode survival @p
  - /tp @p 38.5 70 170.5 180 10
  - /summon pig ~ ~ ~
  - /summon cow ~ ~ ~
  - /summon sheep ~ ~ ~
  - /summon chicken ~ ~ ~
  - /summon zombie ~ ~ ~
  - /summon skeleton ~ ~ ~
  - /summon creeper ~ ~ ~
  - /kill @e[type=pig,r=96]
  - /kill @e[type=cow,r=96]
  - /kill @e[type=sheep,r=96]
  - /kill @e[type=chicken,r=96]
  - /kill @e[type=zombie,r=96]
  - /kill @e[type=skeleton,r=96]
  - /kill @e[type=creeper,r=96]
  - /summon zombie 38.5 70 163.5 {IsBaby:0b,PersistenceRequired:1b}
  - /summon creeper 36.5 70 164.5 {PersistenceRequired:1b}
  - /summon skeleton 40.5 70 163.5 {PersistenceRequired:1b}
  - /entitydata @e[type=zombie,r=96] {IsBaby:0b}
  - /tp @p 38.5 70 170.5 180 10
setup_settle_ticks: 10
duration_ticks: 80
frames_every: 0
input:
  segments:
    - seconds: 4.0
known_divergences: []
