# The speedrun world: what mcsr-speedrun's policy plays (Elliot, 2026-09-30).
# A 1.7.10 any% needs blazes and endermen, which peaceful removes, so this
# is configs/headline.yaml at normal difficulty, with the policy's input:
# 256x144 frames (its packed yuv420p is made from them on the policy's
# card), one tick a step (the policy acts at 20 Hz) and gamma 1.0 (Bright, as
# the 1.16 renders it was trained on). The HUD is on, as in its training
# footage: not F1, so the hand and the block outline are in the frame
# (lane/hudfix: the outline bit-exact on the device); the pipeline's frames
# do not draw the 2D HUD (hotbar, crosshair) yet. Render distance 4, lane/headline's
# choice from throughput and image strips. make -C oracle script
# CONF=../configs/speedrun.yaml, pipe_bench --config configs/speedrun.yaml.

world:
  seed: 1
  difficulty: normal       # hostiles spawn: blazes and endermen exist
  render_distance: 4       # 64-block overworld fog (lane/headline)
  daylight_cycle: on
  keep_inventory: off
  villages: on
  horses: off
  wolves: off
  ocelots: off
  built_golems: off
  wither: off
  minecarts: off
  boats: off
  redstone: off
  enchanting: off
  anvil: off
  brewing: off
  beacon: off
  maps: off
  fishing: off
  fireworks: off
  book_editing: off
  sign_editing: off

client:
  graphics: fast
  particles: minimal
  observation: 256x144     # the policy's frame (mcsr-speedrun SPEC.md: 256x144 at 20 fps)
  ticks_per_step: 1        # the policy's 20 Hz; 4 is the headline's frame skip
  hud: on                  # the training footage has it (rlsplit-hudframe fixed)
  gamma: 1.0               # the 1.16 training renders' brightness (lane/versionprior: netherite at 0.0 is darker)

engine:
  device_mesh: 1
  device_generation: off
  device_light: off

# seed 1's fresh world under this file (oracle/tests/speedrun-s1.jsonl)
pipeline:
  kind: speedrun
  start: out/java/snapshots/sr-speedrun-s1
