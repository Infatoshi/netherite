name: shield_blocking
world:
  seed: 0
  mode: survival
  type: flat
  structures: false
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule randomTickSpeed 0
  - /gamerule naturalRegeneration false
  - /time set 18000
  - /weather clear
  - /difficulty easy
  - /gamemode survival @p
  - /tp @p 0.5 4 0.5 0 0
  - /fill -5 3 -3 5 3 8 minecraft:stone
  - /replaceitem entity @p slot.hotbar.0 minecraft:shield 1
  - '/summon minecraft:zombie 0.5 4 2.5 {PersistenceRequired:1b}'
  - /effect @e[type=zombie] minecraft:slowness 999 255 true
duration_ticks: 220
frames_every: 5
input:
  segments:
    - seconds: 4.0
      buttons: [3]
    - seconds: 0.1
      buttons: [3]
      look: [1200.0, 0.0]
    - seconds: 4.0
      buttons: [3]
    - seconds: 2.0
known_divergences: []
