# magma.conf - the default config-registry file (core/config.def is the registry).
#
# This is the cwd file magma_game reads at startup unless --conf PATH names another
# one; --set key=value then overrides it, last wins. Every key here is a pool cap,
# read BEFORE any pool is allocated so the entire pre-allocation is a pure function
# of these values. All keys are optional; any key left out uses the compiled-in
# default (game/caps.h CR_DEF_*). Lines are "key = value"; '#' starts a comment.
# An UNKNOWN key is a hard error (exit 2) - run --dump-config for the full key list. Every value below is the current default.
#
# The pool geometry is derived from view_radius R:
#   mesh pool  = (2R+1)^2 slots, each a max_verts_per_chunk vertex slab
#   light pool = (2R+3)^2 slots (view region + 1-chunk apron)
#   owr pool   = (2R+4)^2 slots, each an owr_cells_max decoration buffer

# Max streaming view radius (chunks). DECISION: 8. The runtime radius is clamped
# to this, so raising it enlarges every pool (memory) and lowering it shrinks them.
view_radius = 8

# Per-chunk vertex slab (all 4 layers packed). Densest measured chunk = 55710.
max_verts_per_chunk = 76000

# Decoration cells per owr_run populate window. Fresh saved-world replay hit
# 16728 pre-fluid cells; 49152 is the established trace-oracle ceiling.
owr_cells_max = 49152

# Per-layer concatenated draw buffers (verts/frame). Peaks S/CM/C/T =
# 3.00M / 1.32M / 263K / 526K (solid re-measured 3,001,488 on seed 20260710
# fresh-world tape at rd8; trans 526K on the 12k human tape water view;
# cutout 262,932 on interactive seed-0 plains spawn at vd8 - tall grass).
draw_solid  = 4000000
draw_cutmip = 3250000
draw_cutout = 524288
draw_trans  = 1048576

# Screen-triangle scratch. Measured peak 806120.
max_tris = 2000000

# Live mob budget (reserved; no live entities streamed yet) and entity vertex scratch.
max_mobs      = 256
ent_max_verts = 65536
