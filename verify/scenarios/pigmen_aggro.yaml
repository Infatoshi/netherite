name: pigmen_aggro
world:
  seed: 0
  mode: survival
  type: flat
  structures: false
setup_commands:
  - /gamerule doDaylightCycle false
  - /gamerule doWeatherCycle false
  - /gamerule doMobSpawning false
  - /gamerule randomTickSpeed 0
  - /time set 18000
  - /weather clear
  - /difficulty normal
  - /gamemode survival @p
  - /tp @p 0.5 4 0.5 0 0
  - /fill -8 3 -8 8 3 16 minecraft:netherrack
  - /replaceitem entity @p slot.hotbar.0 minecraft:golden_sword 1
  - /summon zombie_pigman 0.5 4 7.5 {PersistenceRequired:1b}
  - /summon zombie_pigman -2.5 4 8.5 {PersistenceRequired:1b}
  - /summon zombie_pigman 3.5 4 8.5 {PersistenceRequired:1b}
  - /summon zombie_pigman -1.5 4 10.5 {PersistenceRequired:1b}
  - /summon zombie_pigman 2.5 4 10.5 {PersistenceRequired:1b}
duration_ticks: 1400
frames_every: 20
input:
  segments:
    - seconds: 3.0
    - seconds: 1.0
      buttons: [1]
    - seconds: 6.0
      keys: [s]
    - seconds: 5.0
      keys: [s, a]
    - seconds: 5.0
      keys: [s, d]
    - seconds: 15.0
      buttons: [1]
known_divergences: []
