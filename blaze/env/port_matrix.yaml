version: 1
subsystems:
  - name: mining_slice
    supported: true
    sources:
      magma:
        - magma/game/player_ctl.c
        - magma/game/live_sim.c
      shared:
        - blaze/core/player_break.h
        - blaze/core/inventory_stack_rules.h
        - blaze/core/items_tools_armor.h
      blaze:
        - blaze/env/blaze_core.h
        - blaze/env/blaze_cpu.c
    dependencies: []
    required_features: [player, dig, inventory]
    required_artifacts:
      m1:
        - magma/magma_game
        - blaze/env/blaze_cpu.so
        - verify/fixtures/port/s14_t0_r48_no_liquid.bsnp
      m2:
        - blaze/env/blaze_cpu.so
        - blaze/env/blaze_cuda.so
        - blaze/rl/out/snaps/*_d*.bsnp
    m1:
      - uv
      - run
      - --no-project
      - --with
      - numpy
      - python
      - blaze/env/verify_cpu.py
      - --snapshot
      - verify/fixtures/port/s14_t0_r48_no_liquid.bsnp
      - --seeds
      - "14"
      - --ticks
      - "1000"
      - --port-parity
      - --strict-capabilities
      - --features
      - player,dig,inventory
    m2:
      - uv
      - run
      - --no-project
      - --with
      - numpy,torch
      - python
      - blaze/env/verify_cuda.py
    timeout: 1500

  - name: spawn_to_torch
    supported: true
    sources:
      magma:
        - magma/game/player_ctl.c
        - magma/game/runtime.h
        - magma/game/rl_mode.c
        - magma/game/container_live.c
      shared:
        - blaze/core/port_parity.h
        - blaze/core/crafting_recipes.h
        - blaze/core/container_click.h
        - blaze/core/items_core.h
      blaze:
        - blaze/env/blaze_core.h
        - blaze/env/blaze_cpu.c
    dependencies: [mining_slice]
    required_features:
      - player
      - dig
      - inventory
      - items
      - crafting
      - containers
    required_artifacts:
      m1:
        - magma/magma_game
        - blaze/env/blaze_cpu.so
        - verify/fixtures/port/s10_t0_r64_no_liquid.bsnp
        - blaze/rl/fixtures/chain_actions_s10.json
      m2:
        - blaze/env/blaze_cpu.so
        - blaze/env/blaze_cuda.so
        - verify/fixtures/port/s10_t0_r64_no_liquid.bsnp
        - blaze/rl/fixtures/chain_actions_s10.json
    m1:
      - uv
      - run
      - --no-project
      - --with
      - numpy
      - python
      - blaze/env/verify_cpu.py
      - --chain
      - --expected-chain-actions
      - "2058"
      - --snapshot
      - verify/fixtures/port/s10_t0_r64_no_liquid.bsnp
      - --port-parity
      - --strict-capabilities
      - --features
      - player,dig,inventory,items,crafting,containers
    m2:
      - uv
      - run
      - --no-project
      - --with
      - numpy,torch
      - python
      - blaze/env/verify_cuda.py
      - --chain
      - --expected-chain-actions
      - "2058"
      - --snapshot
      - verify/fixtures/port/s10_t0_r64_no_liquid.bsnp
      - --port-parity
      - --strict-capabilities
      - --features
