# train-fast.yaml: the fast trainer's world (lane/vecenv, mcsr-speedrun scripts/fastppo.py through the vector env,
# csrc/runtime/vecenv.h): gold-fast.yaml's world, start and fidelity (spawning, random ticks and weather off), one
# tick a step (the policy's 20 Hz), and the CPU's textured ray cast at 32x32 RGB for the observation
# (client.camera raycast, lane/raycast), no renderer. The macros' chest scan is the binding's own, as
# configs/speedrun-semantic.yaml runs it (rlbind.h nwrl_opts: radius 8 chunks, every 10 ticks).
#   out/runtime/vec_bench --config configs/tests/train-fast.yaml --ns 256,512
world:
  seed: 42
  render_distance: 4
client:
  ticks_per_step: 1
  camera: raycast
  observation: 32x32
engine:
  device_mesh: 1
  device_generation: off
  device_light: off
  render: none
  tick: host
pipeline:
  kind: gold
  start: spawn
fidelity:
  spawning: off
  spawn_types: monster,creature,ambient,water
  mobs: all
  random_ticks: off
  weather: off
performance:
  workers: 30              # 30 of the 32 hardware threads (16, 24, 28, 30, 32 measured: 62.5k, 78.2k, 86.6k, 90.2k, 83.9k env-steps/s at N 512, 4 groups); 2 for the trainer's threads
  streams: 0
  group: 0
  batch: 0
  depth: 0
  layout: any              # any worker steps any env: the pipeline's domain layout keeps env ids 0..255 on one L3's workers and 256..511 on the other's, so two of the vector env's four groups shared half the workers (vec_bench N 512: 72,451 pipe, 83,076 any)
  pin: 0
  place: none
  tune: off
