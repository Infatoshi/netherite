# brute16fast.yaml: brute.yaml's recipe at 16x16 in the shape the dev host's CPU env runs fastest while keeping its
# 8,192-sample update (lane/envcpu, DEVLOG 2026-11-01): 256 envs in 2 groups, the FP32 host cast; everything else,
# the learner's shapes included (a group of 128 envs, horizon 64, minibatches of 8,192), is brute.yaml's.
#   out/runtime/train/ntloop --run configs/brute16fast.yaml [--hours H] [--init W.ntw]
# Why 256 envs: an env's state a step overflows the L3 past about 320 envs on the dev host (two CCDs, 96 + 32 MB):
# DRAM fills 1,027 an env-step at 512 envs against 440 at 256 (vec_bench, a whole episode each); on two of the GPU

policy:
  net:
    kind: small                # 0.46M parameters on the 32x32 cast
  ppo:
    lr: 3e-4
    ent: 0.003                 # 0.01 kept the policy wide and it never committed past the wooden pickaxe (lane/rounds)
    clip: 0.2
    gamma: 0.998
    lam: 0.95
    epochs: 3
    mb: 8192
    horizon: 64
  starts:
    seeds: 42                  # N, A-B or A,B,...: another seed's start captured once by the oracle (lane/seeds)
    archive: ms                # a start saved at each milestone gained (lane/msstarts, lane/srng, lane/evict)
    archive_items: wooden_pickaxe+stone_pickaxe+furnace+iron_ingot+iron_pickaxe+bucket+flint_and_steel+obsidian+diamond_pickaxe
    archive_pool: 16
    archive_share: 0.4
  run:
    hours: 2
    log_every: 60

sim:
  world:
    seed: 42
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    cast_precision: 32         # FP32 host cast: vec_bench +2.6 to 5.5% on both hosts; the trainer +0.9 to 3.9% here, -1.5% in the cast matrix (512x4, layout any)
    observation: 16x16
  pipeline:
    kind: snapshot                 # saved world snapshot (rebranded from legacy gold)
    start: spawn               # seed 42's spawn (configs/checkpoints.tsv); other seeds: policy.starts.seeds
    worlds: 256                # under the dev host's L3 cliff (above)
    groups: 2                  # a group of 128 envs: brute's 8,192-sample update (4 groups: 1.04x, 4,096 samples)
    episode_seconds: 180       # --seconds
  fidelity:
    spawning: off
    spawn_types: monster,creature,ambient,water
    mobs: all
    random_ticks: off
    weather: off
  engine:
    device_mesh: 0
    device_generation: off
    device_light: off
    render: none
    tick: host
  performance:
    workers: 30                # 30 of the dev host's 32 hardware threads; 2 for the trainer's (fastppo --threads)
    streams: 2                 # explicit: 2 CUDA streams
    group: 128                  # explicit: 128 envs/group (256 / 2)
    batch: 256                 # explicit: 256 total batched envs
    depth: 2                   # explicit: 2 in-flight pipeline groups
    layout: doms               # env i on L3 i mod 2, a worker of that L3 (any of its CPUs) steps it: the dev host's two CCDs; the trainer 512x4 +24% (lane/cpuhot)
    pin: 0
    place: none
    tune: off

actions:
  macros:
    macros: base,iron,table-anywhere   # the mine lock, crafting with the iron plans, surfacing, looting
    picks: off                 # on: the craft macro's recipes are a masked head the policy picks (lane/picks)
