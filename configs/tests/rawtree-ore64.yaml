# rawtree-ore64.yaml (lane/rawtree): configs/tests/rawpix64.yaml with 20 s episodes, for the harder ore (5 to 12 blocks
# away, turned 90 to 180 degrees, embedded in dark caves): at 10 s the teacher's held-out wins took a median 154 to 161
# of the 200 steps, so most of its misses were the clock.
#   make -C csrc/runtime rawtree TR_RUN=configs/tests/rawtree-ore64.yaml TR_MIN=0.3333
sim:
  world:
    seed: 1
    render_distance: 4
  client:
    ticks_per_step: 1
    camera: raycast
    cast_precision: 32
    observation: 64x64
  engine:
    device_mesh: 0
    raycast: device
    device_generation: off
    device_light: off
    render: none
    tick: host
  pipeline:
    kind: gold
    start: out/runtime/rawskill/train/s1-0
    worlds: 256
    groups: 4
    episode_seconds: 20
  fidelity:
    spawning: off
    random_ticks: off
    weather: off
  performance:
    workers: 30
    streams: 0
    group: 0
    batch: 0
    depth: 0
    layout: doms
    pin: 0
    place: none
    tune: off
policy:
  actions:
    macros: none
    picks: off
  task:
    item: 15
    keys: forward+back+left+right+jump+mine
    win: 1
    death: -0.5
    look: 0.3
    crack: 0.05
    dist: 0.1
    shaping: potential
  starts:
    library: out/runtime/rawskill/train
    curriculum: off
    pin: on
  ppo:
    lr: 1e-3
    ent: 0.01
    clip: 0.2
    gamma: 0.99
    lam: 0.95
    epochs: 4
    mb: 2048
    horizon: 8
  net:
    kind: small
  run:
    log_every: 1
